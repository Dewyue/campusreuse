services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      # Comma-separated usernames that can open the report desk in 我的.
      STEWARD_USERNAMES: ${STEWARD_USERNAMES:-小兑试号,dewyue,probe_user}
    volumes:
      - market-data:/data
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - api
volumes:
  market-data:
